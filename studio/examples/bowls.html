<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COOKT / Bowl system</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f6ee;color:#142f23;font:16px/1.4 NB,Arial}main{width:1440px;height:1000px;padding:38px 42px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #b1bdb0;padding-bottom:24px}h1{font-size:41px;font-weight:400;letter-spacing:-1.3px;margin:0}header p{font-size:13px;margin:0}.line{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding-top:30px}.line button{background:none;color:inherit;border:0;padding:0;text-align:left;font:inherit;cursor:pointer}.line .img{background:#dce5e1;height:222px;display:flex;align-items:center}.line img{width:100%;height:100%;object-fit:contain}.line span{font-size:17px;display:block;line-height:1.15;margin:13px 0 9px;min-height:39px}.line small{display:block;font-size:11px;opacity:.6;padding-bottom:15px;border-bottom:1px solid #bec8b9}.line button[aria-pressed=true] small{border-bottom:3px solid #113c29;color:#113c29;opacity:1}.detail{display:grid;grid-template-columns:650px 1fr;gap:76px;margin-top:35px}.detail>img{width:650px;height:433px;object-fit:contain;background:white}.options{padding-top:32px}.options>span{text-transform:uppercase;font-size:11px;letter-spacing:.08em}.options h2{font-weight:400;font-size:35px;line-height:1.08;letter-spacing:-1px;margin:17px 0 35px}.options label{font-size:13px;display:block;margin-bottom:9px}.options select{width:100%;padding:14px 0;color:inherit;background:none;border:0;border-bottom:1px solid #9fad9e;font:19px NB}.options p{font-size:13px;max-width:360px;line-height:1.5;margin:26px 0}.options a{color:inherit;font-size:14px;display:inline-block;text-decoration:none;border-bottom:1px solid #aab8a7;padding-bottom:8px}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #dab653;outline-offset:4px}</style><main><header><h1>Bowl system</h1><p>Base set / Bowl alternatives</p></header><div class="line"></div><div class="detail"><img id="selected-image" alt=""><div class="options"><span>Selected dish</span><h2 id="selected-name"></h2><label for="bowl-select">Bowl</label><select id="bowl-select"></select><p id="bowl-note"></p><a id="download" download>Download selected photograph ↓</a></div></div></main><script>const dishes=[{id:'rasta',name:'Jamaican Rasta Chicken Pasta',base:'Green glaze',options:[['Green glaze / base','../assets/rasta-food.png']]},{id:'blackened',name:'Creamy Blackened Chicken Pasta',base:'Warm ivory',options:[['Warm ivory / base','../assets/blackened-food.png'],['Blue rim / alternative','../assets/bowl-options/blackened-blue.png'],['Oxblood detail / alternative','../assets/bowl-options/blackened-oxblood.png']]},{id:'orzo',name:'Lemon Chicken Orzo',base:'Solid cobalt rim',options:[['Solid cobalt rim / base','../assets/orzo-food.png'],['Blue brush rim / alternative','../assets/bowl-options/orzo-brush.png']]},{id:'chipotle',name:'Chipotle Chicken with Corn',base:'Brown earthenware',options:[['Brown earthenware / base','../assets/chipotle-food.png'],['Pale ceramic / alternative','../assets/bowl-options/chipotle-pale.png']]}];let dish=dishes.find(d=>d.id===new URLSearchParams(location.search).get('dish'))||dishes[0];const choices={};document.querySelector('.line').innerHTML=dishes.map(d=>`<button data-id="${d.id}" aria-pressed="${d===dish}"><div class="img"><img src="${d.options[0][1]}" alt="${d.name}"></div><span>${d.name}</span><small>${d.base}</small></button>`).join('');function show(){document.querySelector('#selected-name').textContent=dish.name;const select=document.querySelector('select');select.innerHTML=dish.options.map((o,i)=>`<option value="${i}">${o[0]}</option>`).join('');select.value=choices[dish.id]||0;update();document.querySelectorAll('[data-id]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===dish.id))}function update(){const i=+document.querySelector('select').value;choices[dish.id]=i;const o=dish.options[i];document.querySelector('#selected-image').src=o[1];document.querySelector('#selected-image').alt=dish.name+' / '+o[0];document.querySelector('#download').href=o[1];document.querySelector('[data-id="'+dish.id+'"] img').src=o[1];document.querySelector('[data-id="'+dish.id+'"] small').textContent=o[0];document.querySelector('#bowl-note').textContent=i?'Alternative vessel. Compare with the base set using the selector.':'Base vessel from the supplied color and plate reference.'}document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{dish=dishes.find(d=>d.id===b.dataset.id);show()});document.querySelector('select').onchange=update;show();</script></html>
