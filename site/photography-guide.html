</style></head><body><main id="guide"></main><script>window.COOKT={"photography": {"version": "v003", "status": "In review", "pov": "Sculpted light. Life at the table.", "scope": "Photography direction / September 2026. Human presence is limited to hands, gestures and signs of someone at the table. Full-person lifestyle is outside the current direction. New scenes are generated studies; confirm recipes and portions for the final shoot.", "intro": "COOKT makes a meal worth sitting down to. The photography gives everyday food presence: strong light, expressive ceramics, confident color and the small gestures of eating.", "colorIntro": "Keep the product recognizable. Let the surrounding world change. Packaging colors identify the range; photographic set colors create contrast, atmosphere and rhythm.", "assetPolicy": "Direction studies establish composition, light and atmosphere. They are not evidence of a final recipe, serving size or approved product photograph.", "navigation": [{"id": "pov", "title": "The photo world"}, {"id": "lifestyle", "title": "Life at the table"}, {"id": "food", "title": "Food & ceramics"}, {"id": "color", "title": "Color & sets"}, {"id": "choose", "title": "Choose a photograph"}, {"id": "framing", "title": "Composition"}, {"id": "shoot", "title": "Shoot essentials"}], "images": [{"id": "blue-table", "image": "assets/cookt-photo-blue-table-v002.webp", "alt": "A sunlit blue tile table with an ivory and cobalt bowl of Lemon Chicken Orzo, green glass and yellow striped linen.", "title": "Blue tile / afternoon", "caption": "Blue tile / afternoon · Direction study", "status": "Generated direction study"}, {"id": "yellow-overhead", "image": "assets/cookt-photo-yellow-overhead-v002.webp", "alt": "Jamaican Rasta Chicken Pasta in green ceramic on a yellow surface with open space to the left.", "title": "Yellow field / overhead", "caption": "Yellow field / overhead · Direction study", "status": "Generated direction study"}, {"id": "shared-table", "image": "assets/cookt-photo-shared-table-v002.webp", "alt": "Two meals on a green table and striped runner, with hands entering from opposite edges.", "title": "Two places / overhead", "caption": "Two places / overhead · Direction study", "status": "Generated direction study"}, {"id": "place-setting", "image": "assets/cookt-photo-place-setting-v003.webp", "alt": "A bright wood table with Creamy Blackened Chicken Pasta, clear water, a linen napkin and an empty rust-colored chair.", "title": "A place at the table / implied presence", "caption": "A place at the table · Direction study", "status": "Generated direction study"}, {"id": "detail", "image": "assets/cookt-photo-detail-v001.webp", "alt": "Close detail of the cut face of blackened chicken and sauced penne in ivory and blue ceramic.", "title": "Close appetite / retained detail", "caption": "Close appetite · Retained direction study", "status": "Generated direction study"}], "collections": [{"id": "graphic", "title": "The graphic table", "image": "blue-table", "purpose": "Make someone stop. Make the meal clear.", "use": "Campaigns, homepage heroes, paid social, menu features.", "camera": "Overhead or a steep table view. One meal leads; surrounding objects form a deliberate rhythm.", "rule": "Color comes from the set. Light gives the food weight."}, {"id": "lived", "title": "Life at the table", "image": "shared-table", "purpose": "Make COOKT feel part of a real day.", "use": "Brand stories, CRM, organic social, editorial.", "camera": "A table, a gesture, a setting. Show hands or signs that a meal is about to happen.", "rule": "Direct a small action: set down, pass, lift, eat. Keep faces and full-person scenes outside the current direction."}, {"id": "appetite", "title": "Close appetite", "image": "detail", "purpose": "Show what makes the dish worth eating.", "use": "Product detail pages, carousels, email, food stories.", "camera": "Three-quarter detail, close enough to show sauce, grain, char and a cut face.", "rule": "One texture leads. Keep enough focus to understand the bite."}], "decisions": [{"id": "campaign", "need": "Win attention", "shot": "Graphic table", "why": "A clear silhouette and bold field read fast.", "angle": "Overhead or steep oblique", "frame": "Compose the copy side before placing the plate.", "use": "Homepage / campaign / paid social", "imageId": "yellow-overhead"}, {"id": "menu", "need": "Choose a meal", "shot": "Complete dish", "why": "A consistent angle and scale make comparison easy.", "angle": "True overhead; full ceramic", "frame": "Keep the complete rim and a clear border.", "use": "Menu / range / product listing", "imageProduct": "orzo", "imageView": "image"}, {"id": "detail", "need": "Want the next bite", "shot": "Close appetite", "why": "Texture explains the appeal that a small menu tile cannot.", "angle": "Three-quarter close-up", "frame": "Focus on the cut face, sauce and one recognizable ingredient.", "use": "Product page / food carousel", "imageId": "detail"}, {"id": "occasion", "need": "See it in my day", "shot": "Setting + implied presence", "why": "The table and surrounding details suggest a moment in the day.", "angle": "Across the table or a wider setting", "frame": "Use the chair, glass and light to establish the occasion. Keep faces and full people out.", "use": "Brand story / CRM / organic social", "imageId": "place-setting"}, {"id": "connection", "need": "Feel the shared moment", "shot": "Hands at the table", "why": "Gestures create connection while food remains the subject.", "angle": "Overhead or dining height", "frame": "Capture the pause, action and clean table version.", "use": "Social / community / editorial", "imageId": "shared-table"}, {"id": "package", "need": "Recognize what arrives", "shot": "Package / artwork reference", "why": "The exact current artwork and physical format must be clear.", "angle": "Use the established package angle", "frame": "Keep artwork, proportions and the curated dish styling consistent.", "use": "Commerce / retail / delivery explanation", "imageProduct": "rasta", "imageView": "frontArtwork"}], "colorSets": [{"title": "Cool field, warm food", "image": "blue-table", "colors": ["#285695", "#EFE8D6", "#BA9239"], "labels": ["Blue tile", "Ivory ceramic", "Ochre cloth"], "text": "Blue makes pale, creamy food luminous. Ivory holds the plate edge. Ochre echoes the warmth without turning the whole image yellow."}, {"title": "Bright field, dark ceramic", "image": "yellow-overhead", "colors": ["#EFD575", "#214E37", "#24548B"], "labels": ["Butter yellow", "Green ceramic", "Blue cloth"], "text": "A light yellow surface lifts the dark green plate. A smaller blue element keeps the set crisp. This is a campaign set, not new SKU color coding."}, {"title": "Warm field, light ceramic", "image": "place-setting", "colors": ["#885A36", "#E9DFCA", "#B65A33"], "labels": ["Warm wood", "Ivory ceramic", "Rust upholstery"], "text": "Warm wood and rust give the setting character. Ivory keeps the dish distinct. Clear glass brings light through the scene; preserve neutral whites and open shadows."}], "capture": [{"code": "01", "title": "Dish identity", "deliver": "Each confirmed dish: complete overhead + established packaging view.", "purpose": "Menu, pack and commerce continuity."}, {"code": "02", "title": "Appetite", "deliver": "One close texture and one fork-level three-quarter view per dish.", "purpose": "Product pages and food stories."}, {"code": "03", "title": "Graphic table", "deliver": "Hero, opposite copy side, food-only frame and clean surface.", "purpose": "Campaign and design flexibility."}, {"code": "04", "title": "Life at the table", "deliver": "Setting view, table view, hand gesture sequence and a clean version without hands.", "purpose": "Editorial, CRM and social."}, {"code": "05", "title": "Format coverage", "deliver": "Landscape, 4:5 and separately composed 9:16.", "purpose": "Desktop, feeds and full-screen placements."}], "plates": [{"product": "rasta", "name": "Forest / yellow brush", "status": "Retain", "note": "Deep green glaze, yellow brushwork, warm exposed rim."}, {"product": "blackened", "name": "Ivory / blue brush", "status": "Retain", "note": "Warm ivory, loose blue brushwork, exposed stoneware."}, {"product": "orzo", "name": "Ivory / rich blue", "status": "In review", "note": "New overhead study: smaller creamy orzo, restrained tomatoes, visible rich-blue brush glaze."}, {"product": "chipotle", "name": "Ivory / chipotle brush", "status": "In review", "note": "New overhead study: irregular chicken, grouped corn, expressive deep-brown brush glaze."}], "light": [{"title": "Give light a direction.", "text": "Use a small, defined source from the side or behind. Keep one coherent shadow direction across food, hands and props."}, {"title": "Protect the food.", "text": "Hold detail in pale sauce and dark char. A little fill opens the dish; flags keep the surrounding shadows deep."}, {"title": "Let materials respond.", "text": "Glaze catches a highlight. Glass refracts it. Linen and wood absorb it. Use those differences to build depth."}], "food": [{"title": "Style the actual dish.", "text": "Work from the confirmed recipe and portion. Arrange existing ingredients for visibility; do not add protein, garnish or side dishes to imply a richer serving."}, {"title": "Keep the surface alive.", "text": "Refresh with the product’s own sauce. Retain moist cut faces, distinct pasta and real char. Replace tired food before it becomes dry or clotted."}, {"title": "Give the ceramic room.", "text": "Keep food below the rim and leave enough glaze visible to identify the plate. Use natural, uneven placement; avoid identical chicken pieces arranged in a fan."}], "lifestyle": [{"title": "At the table", "text": "A hand entering the frame adds action without turning the image into a portrait. Keep wrists, utensils and plate scale believable. Capture the untouched setting too."}, {"title": "Implied presence", "text": "An empty chair, a glass, a moved fork or a folded napkin can suggest the person. Let light and the setting establish the occasion. Keep full-person scenes and portraits outside the current direction."}, {"title": "A place at the table", "text": "Use an empty chair, a normal glass of clear water and a ready meal to suggest someone about to sit down. Keep the light directional and the whole setting readable."}], "colorRules": [{"title": "Anchor", "text": "Start with the food and its ceramic. Preserve the glaze and the natural color of the meal."}, {"title": "Secondary", "text": "Choose the largest surrounding surface. Separate the rim from its background and make the food look appetizing."}, {"title": "Tertiary", "text": "Add one smaller counterpoint through glass, cloth, a chair or clothing. Omit it when the dish and surface already have enough energy."}], "setRules": [{"title": "Start with a surface.", "text": "Tile gives structure; painted wood gives a color field; warm wood gives intimacy. Choose one main pattern and keep the other large surfaces quieter."}, {"title": "Add a useful object.", "text": "A glass, fork, napkin or chair makes the setting believable. Choose shape, material and scale together. Each prop should explain the meal or improve the composition."}, {"title": "Leave a little life.", "text": "A moved chair, a bent napkin or a used fork gives the scene a before and after. Keep spills and crumbs intentional; avoid decorative clutter."}], "angles": [{"title": "90° / overhead", "text": "Best for dish recognition, ceramic shape and graphic arrangements. Keep the camera parallel to the table."}, {"title": "35–55° / table view", "text": "Best for food volume, glaze, glass and eating gestures. Keep the far rim visible."}, {"title": "Table height / setting", "text": "Best for the relationship between a meal and its surroundings. Include a chair or table edge; keep faces and full people out of frame."}], "framing": [{"title": "Compose for the placement.", "text": "For a text-led hero, start with roughly one third clear space on the intended copy side. Keep strong grout lines, glass reflections and dark shadows out of the text area."}, {"title": "Shoot alternatives.", "text": "Capture left- and right-copy versions, a tighter food-only frame, 4:5 portrait and a dedicated 9:16 view. A horizontal crop is not a substitute for vertical composition."}, {"title": "Keep useful margins.", "text": "For menu images, leave about 10% beyond the rim as a starting capture margin. Check the real template. Keep important hands, food and utensils away from crop edges."}], "delivery": [{"title": "Before the shoot", "text": "Approve the shot list, exact dishes, ceramics, set samples, intended crops and usage. Agree who signs off food accuracy on set. Limit human presence to hands and partial gestures."}, {"title": "On set", "text": "Photograph the color target in each lighting setup. Tether to the actual layouts. Check portion, glare, hands, plate shape and focus before moving on."}, {"title": "In the edit", "text": "Correct distractions, exposure and color. Preserve material texture, skin and honest food proportions. Do not reshape the meal or replace ingredients."}, {"title": "At delivery", "text": "Supply full-resolution masters, color profile and graded sRGB web crops. Identify SKU, scene, angle, crop and version in filenames; include usage and talent permissions."}], "rules": [{"title": "Sculpted light", "text": "Directional light, readable shadows, truthful food color."}, {"title": "Real scale", "text": "Normal vessels, believable hands, natural dining distance."}, {"title": "Useful compositions", "text": "Capture wide, close, overhead and clean counterparts for the intended touchpoints."}], "acceptance": ["The dish is accurate and appetizing.", "The light has one readable direction.", "Ceramics, hands and utensils have believable scale.", "The composition works in its actual placement."]}, "products": [{"id": "rasta", "name": "Jamaican Rasta Chicken Pasta", "image": "assets/rasta-supplied-v001.webp", "frontArtwork": {"image": "assets/rasta-principal-display-panel-v013.webp", "label": "Principal display panel", "status": "In review"}}, {"id": "blackened", "name": "Creamy Blackened Chicken Pasta", "image": "assets/blackened-supplied-v001.webp", "frontArtwork": {"image": "assets/blackened-principal-display-panel-v013.webp", "label": "Principal display panel", "status": "In review"}}, {"id": "orzo", "name": "Lemon Chicken Orzo", "image": "assets/cookt-orzo-overhead-v007.webp", "frontArtwork": {"image": "assets/orzo-principal-display-panel-v013.webp", "label": "Principal display panel", "status": "In review"}}, {"id": "chipotle", "name": "Chipotle Chicken with Corn", "image": "assets/cookt-chipotle-overhead-v003.webp", "frontArtwork": {"image": "assets/chipotle-principal-display-panel-v013.webp", "label": "Principal display panel", "status": "In review"}}]};</script><script>/* COOKT photography world. Editable content is owned by brand.json. */
'use strict';
const photoEscape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const photoRecord=()=>window.COOKT.photography;
const photoProduct=id=>window.COOKT.products.find(p=>p.id===id);
const pwe=photoEscape;
function pwImage(id,cls='',caption=false){const i=photoRecord().images.find(i=>i.id===id);return `<figure class="pw-photo ${cls}"><img src="${pwe(i.image)}" alt="${pwe(i.alt)}" loading="eager">${caption?`<figcaption>${pwe(i.caption)}</figcaption>`:''}</figure>`;}
function pwRules(rows){return `<div class="pw-rules">${rows.map((x,i)=>`<div><span class="pw-rule-n">${String(i+1).padStart(2,'0')}</span><h3>${pwe(x.title)}</h3><p>${pwe(x.text)}</p></div>`).join('')}</div>`;}
function pwHead(kicker,title,text=''){return `<div class="pw-heading"><span class="pw-kicker">${pwe(kicker)}</span><h2>${pwe(title)}</h2>${text?`<p>${pwe(text)}</p>`:''}</div>`;}
function pwSlide(id,label,body,cls=''){return `<section class="pw-slide ${cls}" id="photo-${id}" data-photo-section="${id}"><header class="pw-running"><span>COOKT / Photography</span><span>${pwe(label)}</span></header>${body}<footer class="pw-folio"><span>Photography direction · In review</span><span class="pw-page-number"></span></footer></section>`;}
function pwReferenceSlide(kind){const refs=window.COOKT_PHOTO_REFS;if(!refs)return '';const ids=kind==='light'?['ref-006','ref-036','ref-217','ref-039']:['ref-015','ref-151','ref-218','ref-007'];const labels=kind==='light'?['Light draws the grid.','Glaze, glass and sauce catch it.','Strong color stays architectural.','A gesture activates the table.']:['Let someone eat.','A chair implies a person.','Keep the plate at real scale.','Compose for connection.'];return pwSlide('refs-'+kind,'Selected visual references',pwHead('From the saved boards',kind==='light'?'Light, color, appetite.':'A meal already in progress.')+`<div class="pw-reference-grid">${ids.map((id,n)=>{const r=refs.find(r=>r.id===id);return `<figure><a href="${pwe(r.pin)}"><img src="${pwe(r.image)}" alt="${pwe(r.alt)}"></a><figcaption><strong>${labels[n]}</strong><span>${r.board} / ${id.replace('ref-','R')}</span></figcaption></figure>`;}).join('')}</div><p class="pw-note">Curated from the saved reference boards. Visual references, not COOKT assets. Source links are attached to each image.</p>`,'pw-ref-slide');}
function renderPhotographyGuide(view='pov'){
const P=photoRecord();let s=[];
s.push(pwSlide('pov','The photo world',`<div class="pw-cover-title"><img src="assets/logo.svg" alt="COOKT"><h1>Photography</h1><p>${pwe(P.pov)}</p></div><div class="pw-cover-images">${pwImage('blue-table')}${pwImage('shared-table')}${pwImage('place-setting')}</div><p class="pw-cover-deck">${pwe(P.intro)}</p>`,'pw-cover'));
s.push(pwReferenceSlide('light'));s.push(pwReferenceSlide('life'));
s.push(pwSlide('collections','One world / three roles',pwHead('The system','Three ways into the meal.')+`<div class="pw-collection-grid">${P.collections.map((c,n)=>`<article>${pwImage(c.image)}<span class="pw-kicker">0${n+1}</span><h3>${pwe(c.title)}</h3><p>${pwe(c.purpose)}</p><small>${pwe(c.use)}</small></article>`).join('')}</div>`));
s.push(pwSlide('light','01 / The graphic table',`<div class="pw-feature-grid"><div>${pwHead('The signature','Sculpted light.')}<p class="pw-large">A clear source.<br>A readable shadow.<br>A meal with presence.</p>${pwRules(P.light)}</div>${pwImage('blue-table')}</div>`,'pw-blue-feature'));
s.push(pwSlide('graphic','01 / The graphic table',`<div class="pw-ad-example">${pwImage('yellow-overhead')}<div class="pw-on-photo"><span class="pw-kicker">A graphic composition</span><h2>Let the<br>meal lead.</h2><p>A complete dish. A strong field.<br>Space ready for the message.</p></div></div><div class="pw-caption-row"><p>Overhead makes the ceramic and the whole meal easy to read. Keep the visual rhythm simple enough to work at thumbnail size.</p><span>Use / campaign, homepage, paid social</span></div>`,'pw-full'));
s.push(pwSlide('lifestyle','02 / Life at the table',`<div class="pw-life-grid">${pwImage('shared-table')}<div>${pwHead('A shared table','Gestures give the picture a reason.')}<p>${pwe(P.lifestyle[0].text)}</p><small>Use / organic social, community, editorial</small></div></div>`,'pw-life'));
s.push(pwSlide('evening','02 / Life at the table',`<div class="pw-evening-grid">${pwImage('place-setting')}<div>${pwHead('Implied presence','Set a place.')}<p class="pw-large">${pwe(P.lifestyle[2].text)}</p><div class="pw-evening-swatches"><i style="background:#103e2c"></i><i style="background:#b65a33"></i><i style="background:#e8dec9"></i></div><p>${pwe(P.lifestyle[1].text)}</p><small>Use / CRM, editorial, occasion-led social</small></div></div>`,'pw-evening'));
s.push(pwSlide('food','03 / Close appetite',pwHead('Food styling','Make the texture tangible.')+pwImage('detail','pw-detail')+pwRules(P.food),'pw-food'));
s.push(pwSlide('color','Color / the decision',pwHead('Build outward from the dish','Anchor. Secondary. Tertiary.',P.colorIntro)+pwRules(P.colorRules)+`<div class="pw-palette-grid">${P.colorSets.map(c=>`<article>${pwImage(c.image)}<div class="pw-swatches">${c.colors.map((color,n)=>`<span><i style="background:${color}"></i>${pwe(c.labels[n])}</span>`).join('')}</div><h3>${pwe(c.title)}</h3><p>${pwe(c.text)}</p></article>`).join('')}</div>`,'pw-color'));
s.push(pwSlide('sets','Set design / material vocabulary',pwHead('Make the set do useful work','Tile. Wood. Cloth. Glass.')+`<div class="pw-material-grid">${pwImage('blue-table')}${pwImage('shared-table')}${pwImage('place-setting')}</div>`+pwRules(P.setRules),'pw-sets'));
s.push(pwSlide('plates','Dish and packaging continuity',pwHead('Keep the product recognizable','One dish. A consistent ceramic.','Retain the curated plate language and the established package photography angle. The wider photographic world can change its distance, surface and occasion.')+`<div class="pw-plate-grid">${P.plates.map(x=>{const p=photoProduct(x.product);return `<article><img src="${pwe(p.image)}" alt="${pwe(p.name)}"><h3>${pwe(p.name)}</h3><p>${pwe(x.name)}</p><small>${pwe(x.status)} / ${pwe(x.note)}</small></article>`;}).join('')}</div><div class="pw-angle-row">${P.angles.map(x=>`<div><h3>${pwe(x.title)}</h3><p>${pwe(x.text)}</p></div>`).join('')}</div>`,'pw-plates'));
s.push(pwSlide('choose','Choose the photograph',pwHead('Start with the job','What does this image need to do?')+`<div class="pw-decision-table"><div class="pw-table-head"><span>Job / touchpoint</span><span>Photograph</span><span>Why / composition</span></div>${P.decisions.map(d=>{const p=d.imageProduct&&photoProduct(d.imageProduct);const src=p?(d.imageView==='frontArtwork'?p.frontArtwork.image:p.image):P.images.find(i=>i.id===d.imageId).image;return `<article><div><h3>${pwe(d.need)}</h3><p>${pwe(d.use)}</p></div><div><img src="${pwe(src)}" alt="${pwe(d.shot)}"><strong>${pwe(d.shot)}</strong></div><div><p>${pwe(d.why)} ${pwe(d.frame)}</p><small>${pwe(d.angle)}</small></div></article>`;}).join('')}</div>`,'pw-choose'));
s.push(pwSlide('framing','Composition / alternate captures',pwHead('Build for the placement','Leave space on purpose.')+`<div class="pw-crop-grid"><div><div class="pw-crop-wide">${pwImage('yellow-overhead')}<span class="pw-clear-zone">Copy area<br><strong>Start with ⅓</strong></span></div><small>Landscape / compose the message side first</small></div><div><div class="pw-crop-portrait">${pwImage('yellow-overhead')}</div><small>4:5 / food crop</small></div><div class="pw-crop-vertical"><span>9:16</span><p>Capture a dedicated vertical.<br>Leave room for the channel’s UI.</p></div></div>`+pwRules(P.framing),'pw-framing'));
s.push(pwSlide('design','Photography in the wider system',pwHead('Photo + type + small graphic accents','Give each element a clear role.')+`<div class="pw-design-grid"><div class="pw-web-example"><div class="pw-example-nav"><img src="assets/logo.svg" alt="COOKT"><span>Meals &nbsp; Our story</span></div><div class="pw-web-hero">${pwImage('yellow-overhead')}<h3>A fresh<br>recipe<br>for frozen.</h3></div><div class="pw-example-label">Campaign / a quiet field carries type</div></div><div class="pw-social-example">${pwImage('place-setting')}<div><img src="assets/logo.svg" alt="COOKT"><span>A fresh recipe<br>for frozen.</span></div><div class="pw-example-label">CRM / image and message in separate blocks</div></div></div><div class="pw-caption-row"><p>Photography carries appetite and lived experience. Type carries the message. Keep iconography and illustration in margins, labels or companion panels, with room around the food.</p><span>Layout studies / not finished applications</span></div>`,'pw-design'));
s.push(pwSlide('shoot','Shoot essentials / coverage',pwHead('A useful library starts on set','Capture the family, not just the hero.')+`<div class="pw-capture-list">${P.capture.map(x=>`<div><span>${x.code}</span><h3>${pwe(x.title)}</h3><p>${pwe(x.deliver)}</p><small>${pwe(x.purpose)}</small></div>`).join('')}</div><div class="pw-shoot-strip">${pwImage('yellow-overhead')}${pwImage('place-setting')}${pwImage('shared-table')}${pwImage('detail')}</div>`,'pw-shoot'));
s.push(pwSlide('delivery','Shoot essentials / quality',pwHead('From brief to delivery','Keep the standard visible.')+pwRules(P.delivery)+`<div class="pw-acceptance"><h3>Every selected image must pass.</h3><ol>${P.acceptance.map(x=>`<li>${pwe(x)}</li>`).join('')}</ol></div><p class="pw-note">${pwe(P.assetPolicy)}</p>`,'pw-delivery'));
if(window.COOKT_PHOTO_REFS)s.push(pwSlide('sources','Reference and asset notes',pwHead('Sources','A curated visual foundation.')+`<div class="pw-credits-grid">${window.COOKT_PHOTO_REFS.map(r=>`<a href="${pwe(r.pin)}"><img src="${pwe(r.image)}" alt="${pwe(r.alt)}"><span>${r.id.replace('ref-','R')} / ${r.board}</span></a>`).join('')}</div><div class="pw-source-copy"><p>Reference images come from the saved pins on the <a href="https://www.pinterest.com/juliacompton/cookt/">cookt</a>, <a href="https://www.pinterest.com/juliacompton/ckt2/">ckt2</a> and <a href="https://www.pinterest.com/juliacompton/ckt/">ckt</a> boards. Pinterest’s recommended products and suggested ideas are excluded. Original creators retain their rights; pin links are provided for source tracing.</p><p>Four new COOKT scenes and one retained close detail are AI-generated direction studies. The existing dish references keep their recorded status. Confirm product accuracy, set samples, hand-talent permissions and usage before production.</p></div>`,'pw-sources'));
return `<article class="photo-guide" data-photo-view="${pwe(view)}"><div class="pw-toolbar"><span>Photography world / ${pwe(P.version)} / ${pwe(P.status)}</span>${P.pdf?`<a href="${pwe(P.pdf)}" target="_blank" rel="noopener">PDF presentation ↗</a>`:'<a href="photography-guide.html" target="_blank" rel="noopener">Open full page ↗</a>'}</div><nav class="pw-jumps" aria-label="Photography page sections">${P.navigation.map(n=>`<a href="#/brand/photography/${n.id}" data-photo-jump="${n.id}">${pwe(n.title)}</a>`).join('')}</nav>${s.join('')}<p class="pw-endnote">${pwe(P.scope)}</p></article>`;
}
function bindPhotographyGuide(){const g=document.querySelector('.photo-guide');if(!g)return;g.querySelectorAll('.pw-slide').forEach((s,i)=>s.querySelector('.pw-page-number').textContent=String(i+1).padStart(2,'0'));g.querySelectorAll('[data-photo-jump]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();history.replaceState({},'',a.getAttribute('href'));const id=a.dataset.photoJump;document.querySelector('#photo-'+id)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth',block:'start'});}));const view=g.dataset.photoView;const id=view==='styling'?'food':view;if(!['pov','all'].includes(id))requestAnimationFrame(()=>document.querySelector('#photo-'+id)?.scrollIntoView({block:'start'}));}

document.querySelector('#guide').innerHTML=renderPhotographyGuide('all');bindPhotographyGuide();</script></body></html>
