sets/views/69831c7b8f9c0415.webp","thumb":"assets/previews/69831c7b8f9c0415.webp","sha256":"bc1f10e1941be52088b4c50d465551c220dd2168cc4338d2ebbb18ccd9428d48","w":1920,"h":1080,"movedAt":"2026-10-09T22:55:25.472Z"}],"archiveRow":"[\"Presentation\",\"\",[\"decks\",\"logo\",\"illustration\",\"pack\"]]"}],"links":[]},{"id":"n37","section":"now","date":"6 Oct","title":"Brand system · menu and editorial applications","status":"current","kinds":["pack","logo","illustration","decks"],"code":"System · v001","note":"20 boards: menus, print, photography, digital and motion. Exact Echo and supplied fronts retained. Delivery packaging remains unresolved.","rows":[{"label":"Presentation","status":"current","note":"","link":null,"kinds":["decks","logo","illustration","pack"],"items":[{"title":"Board 05","status":"current","shape":"wide","src":"assets/views/138903f7fbbbdd8c.webp","view":"assets/views/138903f7fbbbdd8c.webp","thumb":"assets/previews/138903f7fbbbdd8c.webp","sha256":"d711fbd356c1b20a4689c8dcef5a3293452d7839ba9343fa78a977292f9805cd","w":1920,"h":1080,"movedAt":"2026-10-09T22:55:25.472Z"},{"title":"Board 06","status":"current","shape":"wide","src":"assets/views/79cec7522cf4f4c2.webp","view":"assets/views/79cec7522cf4f4c2.webp","thumb":"assets/previews/79cec7522cf4f4c2.webp","sha256":"7d9a402a234a07c6ee60da654a7dcfe0146cbcd8d71e97c8ff1fe23f1094f096","w":1920,"h":1080,"movedAt":"2026-10-09T22:55:25.472Z"}],"archiveRow":"[\"Presentation\",\"\",[\"decks\",\"logo\",\"illustration\",\"pack\"]]"}],"links":[]}],"timeline":[],"counts":{"groups":5,"items":40}}</script>
<script>
(()=>{
const C=JSON.parse(document.getElementById('catalog').textContent),S=C.statusVocabulary,K=C.kinds;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const href=p=>/^https?:/.test(p)?p:encodeURI(p);
const byId=Object.fromEntries(C.groups.map(g=>[g.id,g]));
const main=document.getElementById('main');let flat=[];
const legend=`<div class="legend m">${Object.entries(S).map(([k,v])=>`<span title="${esc(v.meaning)}"><i class="dot d-${k}"></i>${esc(v.label)}</span>`).join('')}</div>`;
function section(title,extra){const s=document.createElement('div');s.className='sec sh';s.innerHTML=`<h2 class="m">${title}</h2>${extra||''}`;main.append(s);return s}
function groupEl(g){
 const sec=document.createElement('section');sec.className='group';sec.id=g.id;sec.dataset.section=g.section;sec.dataset.status=g.status;sec.dataset.query=[g.title,g.code,g.note,S[g.status].label].join(' ').toLowerCase();
 sec.innerHTML=`<div class="gh"><div class="when m"><b>${esc(g.date)}</b>${esc(g.code)}</div><div>
  <div class="gt"><h3>${esc(g.title)}</h3><span class="st m"><i class="dot d-${g.status}"></i>${esc(S[g.status].label)}</span></div>
  <p class="note">${esc(g.note)}</p>
  <p class="links m">${g.links.map(l=>`<a href="${href(l.path)}"${/^https?:/.test(l.path)?' target="_blank" rel="noopener"':''}>${esc(l.label)} ↗</a>`).join('')}</p></div></div>`;
 for(const r of g.rows){
  const row=document.createElement('div');row.className='row';
  const rs=r.status!==g.status?`<span class="st m"><i class="dot d-${r.status}"></i>${esc(S[r.status].label)}</span>`:'';
  if(r.label||rs||r.note)row.innerHTML=`<div class="rh"><span class="rl m">${esc(r.label)}</span>${rs}${r.note?`<span class="rn">${esc(r.note)}</span>`:''}${r.link?`<a class="m" href="${href(r.link)}">Open ↗</a>`:''}</div>`;
  const grid=document.createElement('div');grid.className='grid'+(r.items.some(i=>i.shape==='tall')?' tallrow':'');
  for(const it of r.items){
   const card=document.createElement('article');
   card.className=['card',it.shape,it.bg==='dark'?'dark':'',it.src.endsWith('.svg')?'svg':''].join(' ');
   const tag=it.status!==r.status?`<span class="tag m"><i class="dot d-${it.status}"></i>${esc(S[it.status].label)}</span>`:'';
   card.innerHTML=`<button class="thumb" type="button" aria-label="Enlarge ${esc(it.title)}"><img src="${href(it.thumb)}" alt="${esc(it.title)}" loading="lazy" decoding="async" width="${it.w}" height="${it.h}"></button><div class="cap"><h4>${esc(it.title)}</h4>${tag}</div>`;
   card.dataset.q=[g.code,g.title,r.label,it.title,it.src,S[it.status].label].join(' ').toLowerCase();
   card.dataset.kinds=r.kinds.join(' ');card.dataset.status=it.status;
   const rec={it,g,r,card};flat.push(rec);card.querySelector('.thumb').addEventListener('click',()=>openV(rec));grid.append(card);
  }
  row.append(grid);sec.append(row);
 }
 main.append(sec);
}
section('Current review',legend).dataset.section='now';
C.groups.filter(g=>g.section==='now').forEach(groupEl);
const rs=section('How it got here');
const tl=document.createElement('ol');tl.className='tl sec';
tl.innerHTML=C.timeline.map(t=>`<li><span class="when m">${esc(t.date)}</span><span class="ev">${esc(t.event)}<span class="src m">${t.sources.map(s=>`<a href="${href(s.path)}">${esc(s.label)}</a>`).join(' · ')}</span></span><span class="jumps m">${t.groups.map(id=>`<a class="jump" href="#${id}">${esc(byId[id].title)}</a>`).join('')}</span></li>`).join('');
main.append(tl);
section('Earlier & withdrawn').dataset.section='earlier';
C.groups.filter(g=>g.section==='earlier').forEach(groupEl);

const chips=document.getElementById('chips');let kind='all',q='',scope='all',status='all';
const used=new Set(C.groups.flatMap(g=>g.kinds));
chips.innerHTML=[['all','All'],...Object.entries(K).filter(([k])=>used.has(k))].map(([k,l])=>`<button class="chip" type="button" data-k="${k}" aria-pressed="${k==='all'}">${esc(l)}</button>`).join('');
chips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;kind=b.dataset.k;chips.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));apply()});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();apply()});
const scopes=document.getElementById('scopes'),statusSelect=document.getElementById('status'),jump=document.getElementById('jump');
Object.entries(S).forEach(([k,v])=>statusSelect.add(new Option(v.label,k)));
scopes.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;scope=b.dataset.scope;apply()});
statusSelect.onchange=()=>{status=statusSelect.value;apply()};
jump.onchange=()=>{if(jump.value){location.hash=jump.value;document.getElementById(jump.value).scrollIntoView();}};
function apply(){
 let n=0;const filtering=kind!=='all'||!!q||status!=='all'||!!window.CooktSuiteStarredOnly;
 for(const sec of main.querySelectorAll('.group')){let sn=0;
  const inScope=scope==='all'||scope===sec.dataset.section;
  for(const row of sec.querySelectorAll('.row')){let rn=0;for(const c of row.querySelectorAll('.card')){const item={status:c.dataset.status};const ok=(!window.CooktSuiteStarredOnly||window.CooktSuiteStars?.has(c.dataset.suiteKey))&&inScope&&(kind==='all'||c.dataset.kinds.split(' ').includes(kind))&&(status==='all'||item.status===status)&&(!q||c.dataset.q.includes(q)||sec.dataset.query.includes(q));c.hidden=!ok;if(ok)rn++}row.hidden=!rn;sn+=rn}
  const emptyMatch=!window.CooktSuiteStarredOnly&&!sec.querySelector('.card')&&inScope&&(status==='all'||sec.dataset.status===status)&&(!q||sec.dataset.query.includes(q));
  sec.hidden=!sn&&!emptyMatch;n+=sn;
 }
 main.querySelectorAll('.sec').forEach(s=>{if(s.dataset.section)s.hidden=scope!=='all'&&scope!==s.dataset.section;else s.hidden=filtering||scope==='now'});
 scopes.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scope===scope)));
 const currentJump=jump.value;jump.replaceChildren(new Option('Jump to study',''));C.groups.filter(g=>!document.getElementById(g.id).hidden).forEach(g=>jump.add(new Option(g.title,g.id)));jump.value=currentJump;
 document.getElementById('count').textContent=n+(n===1?' piece':' pieces');document.getElementById('empty').hidden=!!n||!!main.querySelector('.group:not([hidden])');
}
window.addEventListener('hashchange',()=>{const g=byId[location.hash.slice(1)];if(g){scope='all';kind='all';q='';status='all';document.getElementById('q').value='';statusSelect.value='all';chips.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.k==='all'));apply();document.getElementById(g.id).scrollIntoView();}});

window.addEventListener('cookt-suite-filter',apply);
apply();
const dlg=document.getElementById('viewer'),vimg=document.getElementById('vimg');let cur=null;
const vis=()=>flat.filter(r=>!r.card.hidden&&!document.getElementById(r.g.id).hidden);
function openV(r){cur=r;const {it,g}=r;vimg.src=href(it.view);vimg.alt=it.title;vimg.classList.toggle('dark',it.bg==='dark');
 document.getElementById('vt').innerHTML=`<span class="m">${esc(g.date)} · ${esc(g.code)}</span>${esc(g.title)} / ${esc(r.r.label?r.r.label+' / ':'')}${esc(it.title)}`;
 document.getElementById('open').href=href(it.src);
 document.getElementById('vf').innerHTML=[esc(S[it.status].label),it.w+' × '+it.h,'sha256 '+it.sha256.slice(0,12)].map(x=>`<span>${x}</span>`).join('');
 if(!dlg.open)dlg.showModal()}
function step(d){const v=vis(),i=v.indexOf(cur);if(i<0)return;openV(v[(i+d+v.length)%v.length])}
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);document.getElementById('close').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
dlg.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}if(e.key==='ArrowRight'){e.preventDefault();step(1)}});
dlg.addEventListener('close',()=>{vimg.removeAttribute('src');cur&&cur.card.querySelector('.thumb').focus()});
})();
</script>
