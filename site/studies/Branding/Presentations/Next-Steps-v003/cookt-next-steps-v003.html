date-v001/assets/cookt-matched-lifestyle-palettes-v002.png", "status": "In review", "note": "Same composition in both palettes. Desktop comparison only; no selection recorded.", "width": 1395, "height": 579}]}]}};</script><script>'use strict';
const crEscape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function reviewNotice(key){const r=window.COOKT.currentReview;return r?`<aside class="cr-notice"><p>${crEscape(r.assetNotes[key])}</p><a href="#/next-steps">Next steps & current assets ↗</a></aside>`:'';}
function reviewGallery(id){const r=window.COOKT.currentReview,g=r?.assetGroups.find(x=>x.id===id);return g?`<section class="cr-gallery" id="review-${g.id}"><header><h2>${crEscape(g.title)}</h2><p>${crEscape(g.note)}</p></header><div class="cr-images">${g.items.map(x=>`<figure><a href="${crEscape(x.image)}" target="_blank" rel="noopener" aria-label="Open ${crEscape(x.title)}"><img src="${crEscape(x.image)}" width="${x.width}" height="${x.height}" loading="lazy" alt="${crEscape(x.title)}"></a><figcaption><strong>${crEscape(x.title)}</strong><p>${crEscape(x.note)}</p><a href="${crEscape(x.download)}" download>Download review PNG ↓</a></figcaption></figure>`).join('')}</div></section>`:'';}
function renderCurrentReview(){const r=window.COOKT.currentReview,e=crEscape;return `<article class="current-review"><header class="cr-header"><span class="eyebrow">Next steps · ${e(r.date)}</span><h1>${e(r.title)}</h1><p>${e(r.summary)}</p></header><section class="cr-priority"><span class="eyebrow">Next creative share</span><h2>${e(r.nextShare.title)}</h2><ol>${r.nextShare.tasks.map(t=>`<li>${e(t)}</li>`).join('')}</ol><p>${e(r.nextShare.output)}</p></section><section class="cr-inputs"><h2>Awaiting confirmation</h2><div class="cr-tasks">${r.waiting.map(x=>`<article><h3>${e(x.title)}</h3><p>${e(x.text)}</p></article>`).join('')}</div></section><section class="cr-later"><h2>${e(r.later.title)}</h2><p>${e(r.later.text)}</p></section><details class="cr-retain"><summary>Carry forward</summary><ul>${r.carryForward.map(t=>`<li>${e(t)}</li>`).join('')}</ul></details><section class="cr-versions"><h2>Versions and status</h2><div class="cr-version-list">${r.versions.map(x=>`<a href="${e(x.href)}"><div><strong>${e(x.title)}</strong><span>${e(x.version)} · ${e(x.status)}</span></div><p>${e(x.detail)}</p></a>`).join('')}</div></section>${r.assetGroups.map(g=>reviewGallery(g.id)).join('')}</article>`;}
