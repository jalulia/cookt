<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COOKT / Rasta connected flat</title><style>
*{box-sizing:border-box}body{margin:0;background:#103E2C;color:#BFECCF;font:15px/1.4 Arial,sans-serif}a{color:inherit}header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid #bfeccf45}h1{font-size:19px;font-weight:400;margin:0 auto 0 0}button,select{font:inherit;background:#103E2C;color:#BFECCF;border:1px solid #bfeccf60;padding:10px;cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #ED4225;outline-offset:3px}select{max-width:min(400px,90vw)}main{text-align:center;padding:24px}#image{display:block;max-width:100%;height:calc(100dvh - 220px);min-height:200px;object-fit:contain;margin:auto}footer{display:flex;justify-content:space-between;gap:20px;padding:14px 24px;flex-wrap:wrap}#note{max-width:860px;margin:0}#grid{display:none;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}#grid button{padding:0;text-align:left}#grid img{width:100%;height:150px;object-fit:contain;background:white}#grid span{display:block;padding:10px}.overview #grid{display:grid}.overview #image{display:none}@media(max-width:600px){header{padding:12px}h1{flex-basis:100%}main{padding:10px}#image{height:calc(100dvh - 290px)}footer{padding:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style><header><a href="../#p02">← All work</a><h1>Rasta connected flat</h1><button id="overview">Overview</button><button id="prev" aria-label="Previous board">←</button><select id="select" aria-label="Choose board"></select><button id="next" aria-label="Next board">→</button><a href="../downloads/cookt-p02-review-v001.pdf" download>PDF ↓</a></header><main><img id="image" alt=""><div id="grid"></div></main><footer><p id="note">Superseded. Rasta only. Bowl enlarged and cropped through the right and lower trim. In Drive for Rafiz. The four-pack range stays on v012 unless this crop is chosen.</p><a id="download" download>Download image ↓</a><span id="count" role="status"></span></footer><script>
const items=[{"title": "Connected flat", "status": "superseded", "shape": "wide", "src": "assets/views/2f950fd1efe2eb4f.webp", "view": "assets/views/2f950fd1efe2eb4f.webp", "thumb": "assets/previews/2f950fd1efe2eb4f.webp", "sha256": "57bb08bce1ae0467f3122e49a3abbc3765e3638159a852792fdd348335fc7152", "w": 1800, "h": 933}, {"title": "Front", "status": "superseded", "shape": "wide", "src": "assets/views/4464ff26249b621f.webp", "view": "assets/views/4464ff26249b621f.webp", "thumb": "assets/previews/4464ff26249b621f.webp", "sha256": "f6167c9cd192cd051426cc3aec05693244795ddf7a532dd45a2053aac72f8aa3", "w": 1400, "h": 1000}];let at=0;const select=document.getElementById('select');items.forEach((it,n)=>{select.add(new Option((n+1)+' / '+it.title,n));const b=document.createElement('button');const im=document.createElement('img');im.src='../'+it.thumb;im.alt=it.title;im.loading='lazy';const caption=document.createElement('span');caption.textContent=it.title;b.append(im,caption);b.onclick=()=>show(n);document.getElementById('grid').append(b)});
function show(n){at=Math.max(0,Math.min(items.length-1,n));document.body.classList.remove('overview');const it=items[at];const im=document.getElementById('image');im.src='../'+it.view;im.alt=it.title;select.value=at;document.getElementById('download').href='../'+it.src;document.getElementById('prev').disabled=at===0;document.getElementById('next').disabled=at===items.length-1;document.getElementById('count').textContent=(at+1)+' / '+items.length;history.replaceState(null,'','#board-'+(at+1))}
document.getElementById('prev').onclick=()=>show(at-1);document.getElementById('next').onclick=()=>show(at+1);select.onchange=()=>show(Number(select.value));document.getElementById('overview').onclick=()=>document.body.classList.toggle('overview');document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;let n;if(e.key==='ArrowLeft')n=at-1;if(e.key==='ArrowRight')n=at+1;if(e.key==='Home')n=0;if(e.key==='End')n=items.length-1;if(e.key==='Escape')document.body.classList.toggle('overview');if(n!==undefined){e.preventDefault();show(n)}});show(Number(location.hash.replace('#board-',''))-1||0);
</script></html>
