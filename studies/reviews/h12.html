<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COOKT / Logo decks and alternates</title><style>
*{box-sizing:border-box}body{margin:0;background:#103E2C;color:#BFECCF;font:15px/1.4 Arial,sans-serif}a{color:inherit}header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid #bfeccf45}h1{font-size:19px;font-weight:400;margin:0 auto 0 0}button,select{font:inherit;background:#103E2C;color:#BFECCF;border:1px solid #bfeccf60;padding:10px;cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #ED4225;outline-offset:3px}select{max-width:min(400px,90vw)}main{text-align:center;padding:24px}#image{display:block;max-width:100%;height:calc(100dvh - 220px);min-height:200px;object-fit:contain;margin:auto}footer{display:flex;justify-content:space-between;gap:20px;padding:14px 24px;flex-wrap:wrap}#note{max-width:860px;margin:0}#grid{display:none;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}#grid button{padding:0;text-align:left}#grid img{width:100%;height:150px;object-fit:contain;background:white}#grid span{display:block;padding:10px}.overview #grid{display:grid}.overview #image{display:none}@media(max-width:600px){header{padding:12px}h1{flex-basis:100%}main{padding:10px}#image{height:calc(100dvh - 290px)}footer{padding:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style><header><a href="../#h12">← All work</a><h1>Logo decks and alternates</h1><button id="overview">Overview</button><button id="prev" aria-label="Previous board">←</button><select id="select" aria-label="Choose board"></select><button id="next" aria-label="Next board">→</button><a href="../downloads/cookt-h12-review-v001.pdf" download>PDF ↓</a></header><main><img id="image" alt=""><div id="grid"></div></main><footer><p id="note">Superseded. Logo deck rounds 1 and 2 and the wordmark alternates that led to the A/B comparison.</p><a id="download" download>Download image ↓</a><span id="count" role="status"></span></footer><script>
const items=[{"title": "v002", "status": "superseded", "shape": "wide", "src": "assets/views/bdc12a47dd1bb774.webp", "view": "assets/views/bdc12a47dd1bb774.webp", "thumb": "assets/previews/bdc12a47dd1bb774.webp", "sha256": "d7210023a25e6da9e074ad9fe1d07c65e99b0fc4c7df4a4858e5f2f412555594", "w": 1920, "h": 1350}, {"title": "v001", "status": "superseded", "shape": "wide", "src": "assets/views/f113f7ec07cd4451.webp", "view": "assets/views/f113f7ec07cd4451.webp", "thumb": "assets/previews/f113f7ec07cd4451.webp", "sha256": "98b5f4c1ae11c004c0629f3cca90cda4f4bafcfe997f7987b61de49252d3144d", "w": 1920, "h": 1350}, {"title": "v004 · Echo flared", "status": "proposed", "shape": "wide", "src": "assets/views/2a060c696bf69d0e.webp", "view": "assets/views/2a060c696bf69d0e.webp", "thumb": "assets/previews/2a060c696bf69d0e.webp", "sha256": "5c23677b675f2ffe7614abcfdb0e46f9371211b7a9fef1c689e8ea7c4738649c", "w": 2400, "h": 1714}, {"title": "v001 · evolve", "status": "proposed", "shape": "wide", "src": "assets/views/f115dedd7dd8b879.webp", "view": "assets/views/f115dedd7dd8b879.webp", "thumb": "assets/previews/f115dedd7dd8b879.webp", "sha256": "6fbacfb100375da0e1818d23ce62947213578327c09ec5c47300f67ece5e9242", "w": 2400, "h": 1714}];let at=0;const select=document.getElementById('select');items.forEach((it,n)=>{select.add(new Option((n+1)+' / '+it.title,n));const b=document.createElement('button');const im=document.createElement('img');im.src='../'+it.thumb;im.alt=it.title;im.loading='lazy';const caption=document.createElement('span');caption.textContent=it.title;b.append(im,caption);b.onclick=()=>show(n);document.getElementById('grid').append(b)});
function show(n){at=Math.max(0,Math.min(items.length-1,n));document.body.classList.remove('overview');const it=items[at];const im=document.getElementById('image');im.src='../'+it.view;im.alt=it.title;select.value=at;document.getElementById('download').href='../'+it.src;document.getElementById('prev').disabled=at===0;document.getElementById('next').disabled=at===items.length-1;document.getElementById('count').textContent=(at+1)+' / '+items.length;history.replaceState(null,'','#board-'+(at+1))}
document.getElementById('prev').onclick=()=>show(at-1);document.getElementById('next').onclick=()=>show(at+1);select.onchange=()=>show(Number(select.value));document.getElementById('overview').onclick=()=>document.body.classList.toggle('overview');document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;let n;if(e.key==='ArrowLeft')n=at-1;if(e.key==='ArrowRight')n=at+1;if(e.key==='Home')n=0;if(e.key==='End')n=items.length-1;if(e.key==='Escape')document.body.classList.toggle('overview');if(n!==undefined){e.preventDefault();show(n)}});show(Number(location.hash.replace('#board-',''))-1||0);
</script></html>
