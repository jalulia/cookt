<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COOKT / Brand Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#103E2C;color:#BFECCF;font:15px/1.4 Arial,sans-serif}a{color:inherit}header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid #bfeccf45}h1{font-size:19px;font-weight:400;margin:0 auto 0 0}button,select{font:inherit;background:#103E2C;color:#BFECCF;border:1px solid #bfeccf60;padding:10px;cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #ED4225;outline-offset:3px}select{max-width:min(400px,90vw)}main{text-align:center;padding:24px}#image{display:block;max-width:100%;height:calc(100dvh - 220px);min-height:200px;object-fit:contain;margin:auto}footer{display:flex;justify-content:space-between;gap:20px;padding:14px 24px;flex-wrap:wrap}#note{max-width:860px;margin:0}#grid{display:none;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}#grid button{padding:0;text-align:left}#grid img{width:100%;height:150px;object-fit:contain;background:white}#grid span{display:block;padding:10px}.overview #grid{display:grid}.overview #image{display:none}@media(max-width:600px){header{padding:12px}h1{flex-basis:100%}main{padding:10px}#image{height:calc(100dvh - 290px)}footer{padding:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style><header><a href="../#n08">← All work</a><h1>Brand Studio</h1><button id="overview">Overview</button><button id="prev" aria-label="Previous board">←</button><select id="select" aria-label="Choose board"></select><button id="next" aria-label="Next board">→</button><a href="../downloads/cookt-n08-review-v001.pdf" download>PDF ↓</a></header><main><img id="image" alt=""><div id="grid"></div></main><footer><p id="note">Superseded. Local Studio on the v014 fronts, panels, typography alternatives and the native range scene. On publication hold; the public Studio is unchanged.</p><a id="download" download>Download image ↓</a><span id="count" role="status"></span></footer><script>
const items=[{"title": "Range · earlier capture", "status": "record", "shape": "wide", "src": "assets/views/bec70cbd5650e4ce.webp", "view": "assets/views/bec70cbd5650e4ce.webp", "thumb": "assets/previews/bec70cbd5650e4ce.webp", "sha256": "2006e0d303182ccffec65f18dfe9e234f3b07c42c4abb231f898b0cd24db28bd", "w": 1440, "h": 1000}, {"title": "Pack inspector · earlier capture", "status": "record", "shape": "wide", "src": "assets/views/f072483185ce1547.webp", "view": "assets/views/f072483185ce1547.webp", "thumb": "assets/previews/f072483185ce1547.webp", "sha256": "868510850576c9221574430b9fc50bd7bcfd59fc46b5f393012a076c771ba885", "w": 1440, "h": 1000}, {"title": "Bowls · earlier capture", "status": "record", "shape": "wide", "src": "assets/views/8ee9e89f9c5d6263.webp", "view": "assets/views/8ee9e89f9c5d6263.webp", "thumb": "assets/previews/8ee9e89f9c5d6263.webp", "sha256": "a61adaa598c1c625439816a441c4c94b228b60b65642c937334380a0e788202f", "w": 1440, "h": 1000}];let at=0;const select=document.getElementById('select');items.forEach((it,n)=>{select.add(new Option((n+1)+' / '+it.title,n));const b=document.createElement('button');const im=document.createElement('img');im.src='../'+it.thumb;im.alt=it.title;im.loading='lazy';const caption=document.createElement('span');caption.textContent=it.title;b.append(im,caption);b.onclick=()=>show(n);document.getElementById('grid').append(b)});
function show(n){at=Math.max(0,Math.min(items.length-1,n));document.body.classList.remove('overview');const it=items[at];const im=document.getElementById('image');im.src='../'+it.view;im.alt=it.title;im.style.background=it.bg==='dark'?'#103E2C':'#EDF3EF';select.value=at;document.getElementById('download').href='../'+it.src;document.getElementById('prev').disabled=at===0;document.getElementById('next').disabled=at===items.length-1;document.getElementById('count').textContent=(at+1)+' / '+items.length;history.replaceState(null,'','#board-'+(at+1))}
document.getElementById('prev').onclick=()=>show(at-1);document.getElementById('next').onclick=()=>show(at+1);select.onchange=()=>show(Number(select.value));document.getElementById('overview').onclick=()=>document.body.classList.toggle('overview');document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;let n;if(e.key==='ArrowLeft')n=at-1;if(e.key==='ArrowRight')n=at+1;if(e.key==='Home')n=0;if(e.key==='End')n=items.length-1;if(e.key==='Escape')document.body.classList.toggle('overview');if(n!==undefined){e.preventDefault();show(n)}});show(Number(location.hash.replace('#board-',''))-1||0);
</script></html>
