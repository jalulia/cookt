function show(n){at=Math.max(0,Math.min(items.length-1,n));document.body.classList.remove('overview');const it=items[at];const im=document.getElementById('image');im.src='../'+it.view;im.alt=it.title;im.style.background=it.bg==='dark'?'#103E2C':'#EDF3EF';select.value=at;document.getElementById('download').href='../'+it.src;document.getElementById('prev').disabled=at===0;document.getElementById('next').disabled=at===items.length-1;document.getElementById('count').textContent=(at+1)+' / '+items.length;history.replaceState(null,'','#board-'+(at+1))}
