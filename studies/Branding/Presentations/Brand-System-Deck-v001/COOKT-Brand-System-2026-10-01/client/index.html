<style>
/* Layout: a single column of 1440x900 boards on the brand ground, one fixed bar above. Deliberately single-theme (the brand's deep green). */
:root{--ground:#103E2C;--paper:#F7F7F2;--line:rgba(247,247,242,.18);--muted:rgba(247,247,242,.72);--display:Lexend,"Helvetica Neue",Arial,sans-serif;--bar:56px;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--paper);font:400 14px/1.4 var(--display)}
.bar{position:fixed;z-index:10;left:0;right:0;top:0;padding:env(safe-area-inset-top,0px) 16px 0;background:var(--ground);border-bottom:1px solid var(--line)}
.bar-in{height:var(--bar);display:flex;align-items:center;gap:20px;max-width:1520px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;color:var(--paper);text-decoration:none;margin-right:auto;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.brand svg{width:76px;height:auto;fill:currentColor;display:block}
.links{display:flex;gap:22px}
.links a{color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.links a:hover,.links a:focus-visible{color:var(--paper)}
select{background:transparent;color:var(--paper);border:1px solid var(--line);font:inherit;font-size:12px;letter-spacing:.04em;padding:6px 8px;max-width:260px}
select option{background:var(--ground)}
.count{font-size:12px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
main{padding-block:calc(var(--bar) + env(safe-area-inset-top,0px) + 16px) 32px;padding-inline:16px;display:grid;gap:16px;justify-items:center}
.board{position:relative;width:100%;max-width:1520px;aspect-ratio:1440/900;scroll-margin-top:calc(var(--bar) + env(safe-area-inset-top,0px) + 12px);background:#0d3424}
.board img{display:block;width:100%;height:100%;max-width:100%}
.hot{position:absolute;border:0;padding:0;background:transparent;cursor:pointer;border-radius:999px}
.hot:focus-visible{outline:2px solid var(--paper);outline-offset:4px}
.core-row{max-width:1520px;width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:-4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.core-row span{margin-right:8px}
.pick{min-height:34px;padding:0 14px;border:1px solid var(--line);background:transparent;color:var(--paper);font:inherit;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.pick[aria-pressed=true]{background:var(--paper);color:var(--ground);border-color:var(--paper)}
.note{max-width:1520px;width:100%;color:var(--muted);font-size:12px;letter-spacing:.04em;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
@media(max-width:1100px){.links{display:none}}
@media(max-width:640px){.brand span,.count{display:none}select{max-width:180px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<script>
const boards=[...document.querySelectorAll('.board')],sel=document.getElementById('jump'),count=document.getElementById('count');let active=0;
const pad=()=>document.querySelector('.bar').getBoundingClientRect().height;
function go(i){i=Math.max(0,Math.min(boards.length-1,i));boards[i].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}
sel.addEventListener('change',()=>go(+sel.value));
let tick=false;function sync(){const y=pad()+40;let best=0;boards.forEach((b,i)=>{if(b.getBoundingClientRect().top-y<=0)best=i});active=best;sel.value=best;count.textContent=String(best+1).padStart(2,'0')+' / '+String(boards.length).padStart(2,'0');tick=false}
addEventListener('scroll',()=>{if(!tick){requestAnimationFrame(sync);tick=true}},{passive:true});
addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName)&&!e.key.startsWith('Arrow'))return;if(e.target.tagName==='SELECT')return;
 if(['ArrowDown','ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(active+1)}if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(active-1)}
 if(e.key==='Home'){e.preventDefault();go(0)}if(e.key==='End'){e.preventDefault();go(boards.length-1)}});
const coreImg=document.getElementById('core-img'),names={green:'deep green',mint:'mint',icy:'icy blue'};
['p08-mint','p08-icy'].forEach(n=>{const i=new Image();i.src='boards/'+n+'.webp'});
function setCore(c){coreImg.src='boards/'+(c==='green'?'p08':'p08-'+c)+'.webp';coreImg.alt='Board 08: Core color, '+names[c];
 document.querySelectorAll('.hot,.pick').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.core===c)))}
document.querySelectorAll('.hot,.pick').forEach(b=>b.addEventListener('click',()=>setCore(b.dataset.core)));
sync();
</script>
